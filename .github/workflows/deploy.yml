# Deploys the static game to GitHub Pages on every push to main/master.
#
# To use:  Repo -> Settings -> Pages -> "Build and deployment" -> Source:
#          select "GitHub Actions". After this workflow runs once, the game is
#          live at https://<your-username>.github.io/<this-repo>/
name: Deploy game to GitHub Pages

on:
  push:
    branches: [main, master]
  # Allow running it on demand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at the same time (Pages requires this)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage the static site (game files only)
        run: |
          mkdir -p site/js
          cp index.html styles.css site/
          cp -r js/. site/js/   # recursive: includes js/world/ and js/systems/
          # Serve verbatim, no Jekyll processing
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
